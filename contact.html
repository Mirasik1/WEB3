<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact Us</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom sticky-top" aria-label="Main navigation">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold text-uppercase tracking-wide" href="index.html">NomadAUTO</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav gap-3">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="cars.html">Cars</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="about.html">About Team</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="contact.html" aria-current="page">Contact</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="page-grid container my-4 my-lg-5">

    <header class="grid-header text-center mb-4">
      <h1 class="display-4 fw-bold">GET IN TOUCH</h1>
      <p class="lead text-secondary">Have questions about our vehicle models or services? Send us a message.</p>
    </header>

    <aside class="grid-sidebar p-3 rounded">
      <h3 class="h5 mb-3">Quick Links</h3>
      <ul class="list-unstyled mb-0">
        <li class="mb-2"><a href="#contact-form-sec" class="text-decoration-none">Inquiry Form</a></li>
      </ul>
    </aside>

    <main class="grid-main p-4 rounded" id="contact-form-sec">
      <h2 class="h3 mb-3 text-light">Contact Us</h2>

      <form id="contact-form" class="row g-3">
        
        <div class="col-12 col-md-6">
          <label for="username" class="form-label text-secondary small text-uppercase fw-semibold">Full Name</label>
          <input type="text" class="form-control bg-dark text-white border-secondary" id="username" name="username" placeholder="Enter your full name" required>
        </div>

        <div class="col-12 col-md-6">
          <label for="email" class="form-label text-secondary small text-uppercase fw-semibold">Email Address</label>
          <input type="email" class="form-control bg-dark text-white border-secondary" id="email" name="email" placeholder="name@example.com" required>
        </div>

        <div class="col-12">
          <label for="model-choice" class="form-label text-secondary small text-uppercase fw-semibold">Model of Interest</label>
          <select class="form-select bg-dark text-white border-secondary" id="model-choice" name="model">
            <option value="911">Porsche 911 Carrera</option>
            <option value="m4">BMW M4 Competition</option>
            <option value="rs6">Audi RS6 Avant</option>
          </select>
        </div>

        <div class="col-12">
          <label for="message" class="form-label text-secondary small text-uppercase fw-semibold">Your Message</label>
          <textarea class="form-control bg-dark text-white border-secondary" id="message" name="message" rows="4" placeholder="Write your inquiry here..." required></textarea>
        </div>

        <div class="col-12">
          <div class="form-check">
            <input class="form-check-input bg-dark border-secondary" type="checkbox" value="" id="newsletterCheck">
            <label class="form-check-label text-secondary small" for="newsletterCheck">
              Subscribe to NomadAUTO news and updates
            </label>
          </div>
        </div>

        <div class="col-12">
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold text-uppercase">Submit Inquiry</button>
        </div>

      </form>
    </main>

    <footer class="grid-footer text-center py-4 border-top border-secondary mt-4">
      <p class="mb-1 text-secondary">Team Members: Miras, Bekarys</p>
      <p class="mb-0 text-secondary">&copy; 2026 WEB1 Team Project. All rights reserved.</p>
    </footer>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
